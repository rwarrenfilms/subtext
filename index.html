<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtext — Full site coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --ink: #000000;
    --hairline: #2A2A2A;
    --grey: #8C8C87;
    --paper: #F5F4F0;
      }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
        background: var(--ink);
    color: var(--paper);
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem;
    position: relative;
    overflow: hidden;
}

  a { color: inherit; text-decoration: none; }

  /* Side contact block — static, no animation, present from load */
  .contact-block {
        position: fixed;
    right: 2.75rem;
    bottom: 2.75rem;
    text-align: right;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--grey);
    line-height: 1.8;
}

  .contact-block a { transition: color 0.2s ease; }
  .contact-block a:hover { color: var(--paper); }

  @media (max-width: 640px) {
    .contact-block {
          position: static;
      margin-top: 3.5rem;
      text-align: center;
}
}

  /* Center content */
  .center {
        text-align: center;
    max-width: 34rem;
}

  .eyebrow-group {
        opacity: 0;
    animation: rise 1s ease forwards 0.2s;
}

  .eyebrow {
        font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--grey);
    margin-bottom: 1.75rem;
}

  .mark {
        font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1;
}

  .mark sup {
        font-size: 0.444em;
    font-weight: 300;
    position: relative;
    top: 0.056em;
    vertical-align: top;
}

  .subtitle {
        font-family: 'Outfit', sans-serif;
    font-weight: 300;
    margin-top: 2rem;
    font-size: clamp(0.95rem, 1.6vw, 1.05rem);
    line-height: 1.65;
    letter-spacing: 0.01em;
    color: var(--grey);
    max-width: 32ch;
    margin-left: auto;
    margin-right: auto;
    opacity: 0;
    animation: rise 1s ease forwards 1.3s;
}

  .cta-group {
        margin-top: 3rem;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
    opacity: 0;
    animation: rise 1s ease forwards 2.4s;
}

  .cta-button {
        display: inline-block;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 1.1rem 2.25rem;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
}

  .cta-button:hover {
        border-color: var(--paper);
    background: var(--paper);
    color: var(--ink);
}

  .cta-microcopy {
        font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--grey);
    letter-spacing: 0.02em;
}

  @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

  @media (prefers-reduced-motion: reduce) {
        .eyebrow-group, .subtitle, .cta-group {
      opacity: 1;
      animation: none;
      transform: none;
}
}
</style>
  </head>
  <body>

    <div class="center">
      <div class="eyebrow-group">
        <p class="eyebrow">Full site coming soon</p>
        <h1 class="mark">SUBTEXT<sup>&reg;</sup></h1>
      </div>

      <p class="subtitle">Content and production for brands &mdash;<br>from fast social work to full campaigns, built to move the needle.</p>

      <div class="cta-group">
        <a href="mailto:hello@subtxtstudio.com" class="cta-button">Start here</a>
        <span class="cta-microcopy">Tell us about your brand and what you need.</span>
    </div>
  </div>

  <div class="contact-block">
    <div>E. <a href="mailto:hello@subtxtstudio.com">hello@subtxtstudio.com</a></div>
    <div>M. <a href="tel:+61433506203">0433 506 203</a></div>
    </div>

  </body>
  </html>
